name: Apply PR 387 fullscreen state reconciliation

on:
  push:
    branches:
      - fix-fullscreen-exit-aspect-ratio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-fullscreen-exit-aspect-ratio

      - name: Apply patch
        run: python3 .github/patch_pr387_fullscreen_state.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java app/src/test/java/org/schabi/newpipe/fragments/detail/VideoDetailOrientationHandlingTest.java .github/patch_pr387_fullscreen_state.py .github/workflows/temporary-pr387-fullscreen-state.yml
          git commit -m "Reconcile fullscreen state from laid out viewport"
          git push origin HEAD:fix-fullscreen-exit-aspect-ratio
