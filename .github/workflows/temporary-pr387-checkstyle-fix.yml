name: Fix PR 387 checkstyle

on:
  push:
    branches:
      - fix-fullscreen-exit-aspect-ratio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-fullscreen-exit-aspect-ratio

      - name: Add return documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java')
          source = path.read_text()
          old = '''     * fullscreen-state synchronization runs. This prevents a horizontal video from
           * being measured with portrait fullscreen dimensions while rotating upright.
           */
          private boolean isFullscreenForCurrentOrientation() {
          '''
          new = '''     * fullscreen-state synchronization runs. This prevents a horizontal video from
           * being measured with portrait fullscreen dimensions while rotating upright.
           *
           * @return whether player geometry should currently use fullscreen dimensions
           */
          private boolean isFullscreenForCurrentOrientation() {
          '''
          # YAML indentation can be stripped from block content, so normalize both variants.
          if source.count(old) != 1:
              old = old.replace('          ', '')
              new = new.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'Expected one helper Javadoc block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/temporary-pr387-checkstyle-fix.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java .github/workflows/temporary-pr387-checkstyle-fix.yml
          git commit -m "Document fullscreen geometry helper"
          git push origin HEAD:fix-fullscreen-exit-aspect-ratio
