name: Fix PR 387 checkstyle

on:
  push:
    branches:
      - fix-fullscreen-exit-aspect-ratio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix-fullscreen-exit-aspect-ratio

      - name: Add return documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java')
          source = path.read_text()
          method = '    private boolean isFullscreenForCurrentOrientation() {'
          method_index = source.find(method)
          if method_index < 0:
              raise SystemExit('Fullscreen geometry helper not found')
          javadoc_start = source.rfind('    /**', 0, method_index)
          javadoc_end = source.rfind('    */', javadoc_start, method_index)
          if javadoc_start < 0 or javadoc_end < 0:
              raise SystemExit('Helper Javadoc not found')
          javadoc = source[javadoc_start:javadoc_end]
          if '@return' not in javadoc:
              insertion = ('     *\n'
                           '     * @return whether player geometry should currently use fullscreen dimensions\n')
              source = source[:javadoc_end] + insertion + source[javadoc_end:]
          path.write_text(source)
          Path('.github/workflows/temporary-pr387-checkstyle-fix.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java .github/workflows/temporary-pr387-checkstyle-fix.yml
          git commit -m "Document fullscreen geometry helper"
          git push origin HEAD:fix-fullscreen-exit-aspect-ratio
