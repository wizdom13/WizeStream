name: Apply fullscreen exit aspect ratio patch

on:
  push:
    branches:
      - fix-fullscreen-exit-aspect-ratio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-fullscreen-exit-aspect-ratio

      - name: Patch orientation-aware player geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          fragment_path = Path('app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java')
          source = fragment_path.read_text()

          pattern = re.compile(
              r'(final DisplayMetrics metrics = getResources\(\)\.getDisplayMetrics\(\);\n'
              r'\s+final boolean isPortrait = metrics\.heightPixels > metrics\.widthPixels;\n)'
              r'(\s+requireView\(\)\.getViewTreeObserver\(\)\.removeOnPreDrawListener\(preDrawListener\);\n\n'
              r'\s+)if \(isFullscreen\(\)\) \{'
          )
          source, count = pattern.subn(
              r'\1        final boolean fullscreenForCurrentOrientation = '
              r'isFullscreenForCurrentOrientation();\n\2if (fullscreenForCurrentOrientation) {',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one setHeightThumbnail fullscreen block, found {count}')

          pattern = re.compile(
              r'(if \(isPlayerAvailable\(\)\) \{\n'
              r'\s+final int maxHeight = \(int\) \(metrics\.heightPixels \* MAX_PLAYER_HEIGHT\);\n)'
              r'(\s+player\.UIs\(\)\.get\(VideoPlayerUi\.class\)\.ifPresent\(ui ->\n'
              r'\s+ui\.getBinding\(\)\.surfaceView\.setHeights\(newHeight,\n'
              r'\s+)ui\.isFullscreen\(\) \? newHeight : maxHeight\)\);'
          )
          source, count = pattern.subn(
              r'\1            final boolean fullscreenForCurrentOrientation = '
              r'isFullscreenForCurrentOrientation();\n\2fullscreenForCurrentOrientation ? newHeight : maxHeight));',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one surface height block, found {count}')

          marker = '''    private boolean isFullscreen() {
              return isPlayerAvailable() && player.UIs().get(VideoPlayerUi.class)
                      .map(VideoPlayerUi::isFullscreen).orElse(false);
          }
          '''
          helper = '''    private boolean isFullscreen() {
              return isPlayerAvailable() && player.UIs().get(VideoPlayerUi.class)
                      .map(VideoPlayerUi::isFullscreen).orElse(false);
          }

          /**
           * Resolves player geometry from the current configuration before the deferred
           * fullscreen-state synchronization runs. This prevents a horizontal video from being
           * measured with portrait fullscreen dimensions while rotating back upright.
           */
          private boolean isFullscreenForCurrentOrientation() {
              if (!isPlayerAvailable() || activity == null) {
                  return false;
              }
              final boolean orientationIndependent = DeviceUtils.isTablet(activity)
                      || DeviceUtils.isTv(activity)
                      || DeviceUtils.isDesktopMode(activity);
              final int orientation = getResources().getConfiguration().orientation;
              return player.UIs().get(MainPlayerUi.class)
                      .map(ui -> fullscreenStateForOrientation(
                              orientation,
                              ui.isFullscreen(),
                              ui.isVerticalVideo(),
                              orientationIndependent,
                              player.isAudioOnly()))
                      .orElse(false);
          }
          '''
          # Normalize YAML-stripped indentation for this small marker before matching.
          marker = '\n'.join(line[8:] if line.startswith('        ') else line
                             for line in marker.splitlines()) + '\n'
          helper = '\n'.join(line[8:] if line.startswith('        ') else line
                             for line in helper.splitlines()) + '\n'
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one isFullscreen helper block, found {source.count(marker)}')
          source = source.replace(marker, helper, 1)
          fragment_path.write_text(source)

          test_path = Path('app/src/test/java/org/schabi/newpipe/fragments/detail/VideoDetailOrientationHandlingTest.java')
          test = test_path.read_text()
          marker = '    @Test\n    public void landscapePhoneVideoEntersFullscreenRegardlessOfPlaybackState() {'
          addition = '''    @Test
          public void playerGeometryUsesTargetOrientationBeforeDeferredFullscreenSync()
                  throws Exception {
              final String fragment = Files.readString(projectDirectory.resolve(
                      "java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java"));

              assertTrue(fragment.contains("private boolean isFullscreenForCurrentOrientation()"));
              assertTrue(fragment.contains("final boolean fullscreenForCurrentOrientation = "
                      + "isFullscreenForCurrentOrientation();"));
              assertTrue(fragment.contains("if (fullscreenForCurrentOrientation)"));
              assertTrue(fragment.contains(
                      "fullscreenForCurrentOrientation ? newHeight : maxHeight"));
          }

          @Test
          public void landscapePhoneVideoEntersFullscreenRegardlessOfPlaybackState() {'''
          addition = '\n'.join(line[8:] if line.startswith('        ') else line
                               for line in addition.splitlines())
          if test.count(marker) != 1:
              raise SystemExit(f'Expected one orientation test marker, found {test.count(marker)}')
          test_path.write_text(test.replace(marker, addition, 1))

          Path('.github/workflows/temporary-fullscreen-aspect-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java app/src/test/java/org/schabi/newpipe/fragments/detail/VideoDetailOrientationHandlingTest.java .github/workflows/temporary-fullscreen-aspect-patch.yml
          git commit -m "Keep video aspect ratio stable while exiting fullscreen"
          git push origin HEAD:fix-fullscreen-exit-aspect-ratio
