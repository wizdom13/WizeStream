name: Apply fullscreen exit aspect ratio patch

on:
  push:
    branches:
      - fix-fullscreen-exit-aspect-ratio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-fullscreen-exit-aspect-ratio

      - name: Patch orientation-aware player geometry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          fragment_path = Path('app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java')
          source = fragment_path.read_text()

          pattern = re.compile(
              r'(final DisplayMetrics metrics = getResources\(\)\.getDisplayMetrics\(\);\n'
              r'\s+final boolean isPortrait = metrics\.heightPixels > metrics\.widthPixels;\n)'
              r'(\s+requireView\(\)\.getViewTreeObserver\(\)\.removeOnPreDrawListener\(preDrawListener\);\n\n'
              r'\s+)if \(isFullscreen\(\)\) \{'
          )
          source, count = pattern.subn(
              r'\1        final boolean fullscreenForCurrentOrientation = '
              r'isFullscreenForCurrentOrientation();\n\2if (fullscreenForCurrentOrientation) {',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one setHeightThumbnail fullscreen block, found {count}')

          pattern = re.compile(
              r'(if \(isPlayerAvailable\(\)\) \{\n'
              r'\s+final int maxHeight = \(int\) \(metrics\.heightPixels \* MAX_PLAYER_HEIGHT\);\n)'
              r'(\s+player\.UIs\(\)\.get\(VideoPlayerUi\.class\)\.ifPresent\(ui ->\n'
              r'\s+ui\.getBinding\(\)\.surfaceView\.setHeights\(newHeight,\n'
              r'\s+)ui\.isFullscreen\(\) \? newHeight : maxHeight\)\);'
          )
          source, count = pattern.subn(
              r'\1            final boolean fullscreenForCurrentOrientation = '
              r'isFullscreenForCurrentOrientation();\n\2fullscreenForCurrentOrientation ? newHeight : maxHeight));',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one surface height block, found {count}')

          marker = '    public boolean isNativePipEligible() {'
          helper = (
              '    /**\n'
              '     * Resolves player geometry from the current configuration before the deferred\n'
              '     * fullscreen-state synchronization runs. This prevents a horizontal video from\n'
              '     * being measured with portrait fullscreen dimensions while rotating upright.\n'
              '     */\n'
              '    private boolean isFullscreenForCurrentOrientation() {\n'
              '        if (!isPlayerAvailable() || activity == null) {\n'
              '            return false;\n'
              '        }\n'
              '        final boolean orientationIndependent = DeviceUtils.isTablet(activity)\n'
              '                || DeviceUtils.isTv(activity)\n'
              '                || DeviceUtils.isDesktopMode(activity);\n'
              '        final int orientation = getResources().getConfiguration().orientation;\n'
              '        return player.UIs().get(MainPlayerUi.class)\n'
              '                .map(ui -> fullscreenStateForOrientation(\n'
              '                        orientation,\n'
              '                        ui.isFullscreen(),\n'
              '                        ui.isVerticalVideo(),\n'
              '                        orientationIndependent,\n'
              '                        player.isAudioOnly()))\n'
              '                .orElse(false);\n'
              '    }\n\n'
          )
          if source.count(marker) != 1:
              raise SystemExit(f'Expected one PiP marker, found {source.count(marker)}')
          source = source.replace(marker, helper + marker, 1)
          fragment_path.write_text(source)

          test_path = Path('app/src/test/java/org/schabi/newpipe/fragments/detail/VideoDetailOrientationHandlingTest.java')
          test = test_path.read_text()
          marker = '    @Test\n    public void landscapePhoneVideoEntersFullscreenRegardlessOfPlaybackState() {'
          addition = (
              '    @Test\n'
              '    public void playerGeometryUsesTargetOrientationBeforeDeferredFullscreenSync()\n'
              '            throws Exception {\n'
              '        final String fragment = Files.readString(projectDirectory.resolve(\n'
              '                "java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java"));\n\n'
              '        assertTrue(fragment.contains(\n'
              '                "private boolean isFullscreenForCurrentOrientation()"));\n'
              '        assertTrue(fragment.contains("final boolean fullscreenForCurrentOrientation = "\n'
              '                + "isFullscreenForCurrentOrientation();"));\n'
              '        assertTrue(fragment.contains("if (fullscreenForCurrentOrientation)"));\n'
              '        assertTrue(fragment.contains(\n'
              '                "fullscreenForCurrentOrientation ? newHeight : maxHeight"));\n'
              '    }\n\n'
          )
          if test.count(marker) != 1:
              raise SystemExit(f'Expected one orientation test marker, found {test.count(marker)}')
          test_path.write_text(test.replace(marker, addition + marker, 1))

          Path('.github/workflows/temporary-fullscreen-aspect-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/org/schabi/newpipe/fragments/detail/VideoDetailFragment.java app/src/test/java/org/schabi/newpipe/fragments/detail/VideoDetailOrientationHandlingTest.java .github/workflows/temporary-fullscreen-aspect-patch.yml
          git commit -m "Keep video aspect ratio stable while exiting fullscreen"
          git push origin HEAD:fix-fullscreen-exit-aspect-ratio
