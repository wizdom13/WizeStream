name: Desktop Nightly release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: wizestream-desktop-nightly
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  NIGHTLY_REPOSITORY: wizdom13/WizeStream_Nightly
  DESKTOP_NIGHTLY_RETENTION_COUNT: "14"

jobs:
  metadata:
    name: Prepare Desktop nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      nightly_tag: ${{ steps.metadata.outputs.nightly_tag }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      skip: ${{ steps.existing.outputs.skip }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out pipe
        uses: actions/checkout@v6
        with:
          ref: pipe
          fetch-depth: 0

      - name: Prepare nightly metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y%m%d)"
          short_sha="${source_sha::7}"
          nightly_tag="desktop-nightly-${build_date}-${short_sha}"
          source_version="$(node -p "require('./desktop/package.json').version")"
          base_version="${source_version%%-*}"
          version="${base_version}-nightly.${build_date}.${short_sha}"

          {
            echo "source_sha=$source_sha"
            echo "build_date=$build_date"
            echo "short_sha=$short_sha"
            echo "nightly_tag=$nightly_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Skip unchanged source commit
        id: existing
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_REPO_TOKEN }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN" || {
            echo "NIGHTLY_REPO_TOKEN is missing" >&2
            exit 1
          }

          existing_tag="$(
            gh api "repos/${NIGHTLY_REPOSITORY}/releases" \
              --paginate \
              --jq '.[].tag_name' \
            | grep -E "^desktop-nightly-[0-9]{8}-${SHORT_SHA}$" \
            | head -n 1 \
            || true
          )"

          if [[ -n "$existing_tag" ]]; then
            echo "Source commit ${SOURCE_SHA} was already published as ${existing_tag}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate Desktop nightly
    needs: metadata
    if: needs.metadata.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    env:
      WIZESTREAM_ENABLE_PRODUCTION_UPDATES: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify Desktop release contract
        run: npm run release:verify
      - name: Verify production updates are disabled
        shell: bash
        run: test "${WIZESTREAM_ENABLE_PRODUCTION_UPDATES:-0}" != '1'
      - run: npm run media-tools:setup
      - run: npm run media-tools:verify
      - run: ../gradlew -p backend test installDist runtimeImage --stacktrace
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  package:
    name: Package Desktop nightly ${{ matrix.name }}
    needs:
      - metadata
      - validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: --linux AppImage deb
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: --linux AppImage deb
          - name: windows-x64
            runner: windows-2025
            target: --win nsis portable
          - name: macos-x64
            runner: macos-15-intel
            target: --mac dmg zip
          - name: macos-arm64
            runner: macos-15
            target: --mac dmg zip
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WIZESTREAM_ENABLE_PRODUCTION_UPDATES: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Set unique Desktop nightly version
        run: npm version ${{ needs.metadata.outputs.version }} --no-git-tag-version --allow-same-version
      - name: Prepare Windows libmpv SDK and runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-libmpv-windows.ps1
      - name: Prepare pinned Unix libmpv SDK and runtime
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/setup-libmpv-unix.sh
      - run: npm run media-tools:setup
      - run: npm run media-tools:verify
      - run: npm run embedded:build
      - run: npm run embedded:verify
      - run: npm run embedded:media-smoke
      - run: npm run backend:build
      - run: npm run build
      - name: Create unpacked application
        run: npx electron-builder --dir --publish never
      - name: Smoke-test packaged application
        run: npm run package:smoke
      - name: Create unsigned nightly packages
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify both Windows package types exist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/*-setup.exe')) { throw 'Missing Windows installer' }
          if (-not (Test-Path 'release/*-portable.exe')) { throw 'Missing Windows portable package' }
      - uses: actions/upload-artifact@v7
        with:
          name: wizestream-desktop-nightly-${{ needs.metadata.outputs.build_date }}-${{ needs.metadata.outputs.short_sha }}-${{ matrix.name }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Desktop nightly
    needs:
      - metadata
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wizestream-desktop-nightly-${{ needs.metadata.outputs.build_date }}-${{ needs.metadata.outputs.short_sha }}-*
          path: release-input

      - name: Prepare installers, manifest and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.nightly_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          mkdir release-ready
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            case "$name" in
              *.AppImage|*.deb|*.exe|*.dmg|*.zip) ;;
              *) continue ;;
            esac
            test ! -e "release-ready/$name"
            cp "$file" "release-ready/$name"
          done < <(find release-input -type f -print0)

          test "$(find release-ready -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 2
          test "$(find release-ready -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-ready -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2

          (cd release-ready && sha256sum * | sort -k2 > SHA256SUMS)
          node -e "const fs=require('fs'); fs.writeFileSync('release-ready/release-manifest.json', JSON.stringify({version:process.env.VERSION,tag:process.env.RELEASE_TAG,nightly:true,prerelease:true,unsigned:true,productionUpdates:false,sourceCommit:process.env.SOURCE_SHA},null,2)+'\\n')"

      - name: Attest Desktop nightly artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-ready/*

      - name: Publish immutable Desktop nightly prerelease
        env:
          BUILD_DATE: ${{ needs.metadata.outputs.build_date }}
          GH_TOKEN: ${{ secrets.NIGHTLY_REPO_TOKEN }}
          NIGHTLY_TAG: ${{ needs.metadata.outputs.nightly_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN" || {
            echo "NIGHTLY_REPO_TOKEN is missing" >&2
            exit 1
          }

          cat > "$RUNNER_TEMP/desktop-nightly-release-notes.md" <<EOF
          > [!WARNING]
          > This is an automated, explicitly unsigned Desktop nightly for testing. It is not a signed public release.

          - Desktop version: ${VERSION}
          - Source commit: ${SOURCE_SHA}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Included platforms:
          - Windows x64 installer and portable executable
          - macOS Intel and Apple Silicon DMG/ZIP
          - Linux x64 and arm64 AppImage/DEB

          Windows and macOS may display unsigned-application warnings. Production automatic updates
          are disabled. Verify downloads with SHA256SUMS and the GitHub artifact attestations.
          Corresponding GPL source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${SOURCE_SHA}
          EOF

          gh release create "$NIGHTLY_TAG" \
            --repo "$NIGHTLY_REPOSITORY" \
            --target main \
            --prerelease \
            --title "WizeStream Desktop Nightly ${BUILD_DATE}" \
            --notes-file "$RUNNER_TEMP/desktop-nightly-release-notes.md" \
            release-ready/*

      - name: Remove Desktop nightlies beyond retention limit
        env:
          CURRENT_NIGHTLY_TAG: ${{ needs.metadata.outputs.nightly_tag }}
          GH_TOKEN: ${{ secrets.NIGHTLY_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          releases_file="$RUNNER_TEMP/desktop-nightly-releases.json"
          gh api "repos/${NIGHTLY_REPOSITORY}/releases" --paginate > "$releases_file"

          while IFS=$'\t' read -r release_id tag_name; do
            [[ -n "$release_id" && -n "$tag_name" ]] || continue
            echo "Deleting old Desktop nightly ${tag_name}"
            gh api -X DELETE "repos/${NIGHTLY_REPOSITORY}/releases/${release_id}"
            gh api -X DELETE "repos/${NIGHTLY_REPOSITORY}/git/refs/tags/${tag_name}" || true
          done < <(
            jq -s -r \
              --arg current_tag "$CURRENT_NIGHTLY_TAG" \
              --argjson keep "$DESKTOP_NIGHTLY_RETENTION_COUNT" \
              'add
              | map(select(.tag_name | test("^desktop-nightly-[0-9]{8}-[0-9a-f]{7}$")))
              | sort_by(.published_at // .created_at) | reverse
              | (map(select(.tag_name == $current_tag))
                 + map(select(.tag_name != $current_tag)))
              | .[$keep:][]
              | [.id, .tag_name] | @tsv' \
              "$releases_file"
          )

      - name: Upload combined Desktop nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: wizestream-desktop-nightly-${{ needs.metadata.outputs.build_date }}-${{ needs.metadata.outputs.short_sha }}
          path: release-ready/*
          if-no-files-found: error
          retention-days: 14
