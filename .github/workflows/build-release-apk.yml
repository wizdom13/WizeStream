name: "Build signed release APK on material"

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "What to do with the signed release APK"
        required: false
        default: "artifacts"
        type: choice
        options:
          - artifacts
          - release
          - all
  push:
    tags:
    - "v*-m*"    

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout PipePipeExtractor source
        run: |
          set -euo pipefail
          # Temporary experiment: keep the checkout path stable while sourcing PipePipeExtractor.
          mkdir -p external
          if [ ! -d external/NewPipeExtractor/.git ]; then
            rm -rf external/NewPipeExtractor
            git init external/NewPipeExtractor
            git -C external/NewPipeExtractor remote add origin https://github.com/wizdom13/PipePipeExtractor
          fi
          git -C external/NewPipeExtractor fetch --depth 1 origin 3b2af63f1f53e87292247ce6603be1e642c1a1aa
          git -C external/NewPipeExtractor checkout --detach FETCH_HEAD

      - name: Verify PipePipeExtractor source
        run: |
          git -C external/NewPipeExtractor remote -v
          test "$(git -C external/NewPipeExtractor rev-parse HEAD)" = "3b2af63f1f53e87292247ce6603be1e642c1a1aa"
          git -C external/NewPipeExtractor remote get-url origin | grep -q "github.com/wizdom13/PipePipeExtractor"
          test -d external/NewPipeExtractor/extractor

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: "Prepare release keystore"
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NEWPIPE_MATERIAL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/newpipe-material-release.jks"

      - name: "Build signed release APK"
        env:
          NEWPIPE_MATERIAL_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/newpipe-material-release.jks
          NEWPIPE_MATERIAL_RELEASE_STORE_PASSWORD: ${{ secrets.NEWPIPE_MATERIAL_RELEASE_STORE_PASSWORD }}
          NEWPIPE_MATERIAL_RELEASE_KEY_ALIAS: ${{ secrets.NEWPIPE_MATERIAL_RELEASE_KEY_ALIAS }}
          NEWPIPE_MATERIAL_RELEASE_KEY_PASSWORD: ${{ secrets.NEWPIPE_MATERIAL_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: "Verify APK signature"
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: "Rename APK"
        id: release_info
        run: |
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/release/output-metadata.json")"
          VERSION_CODE="$(jq -r ".elements[0].versionCode" "app/build/outputs/apk/release/output-metadata.json")"
          RELEASE_TAG="v${VERSION_NAME}"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]; then
            echo "Tag mismatch: pushed tag is '$GITHUB_REF_NAME' but Gradle versionName is '$VERSION_NAME' and expects tag '$RELEASE_TAG'"
            exit 1
          fi

          APK_NAME="NewPipeMaterial_v${VERSION_NAME}.apk"
          APK_PATH="app/build/outputs/apk/release/${APK_NAME}"
          CHANGELOG_PATH="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          mv app/build/outputs/apk/release/*.apk "$APK_PATH"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "changelog_path=$CHANGELOG_PATH" >> "$GITHUB_OUTPUT"

          echo "Version name: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Version code: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "Release tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Changelog: $CHANGELOG_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload APK"
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_target == 'artifacts' || inputs.release_target == 'all') }}
        uses: actions/upload-artifact@v7
        with:
          name: newpipe-material-signed-release-apk
          path: ${{ steps.release_info.outputs.apk_path }}

      - name: "Validate changelog"
        if: ${{ github.event_name == 'push' || inputs.release_target == 'release' || inputs.release_target == 'all' }}
        run: |
          test -s "${{ steps.release_info.outputs.changelog_path }}"

      - name: "Create release"
        if: ${{ github.event_name == 'push' || inputs.release_target == 'release' || inputs.release_target == 'all' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || steps.release_info.outputs.release_tag }}
          target_commitish: material
          name: NewPipe Material ${{ steps.release_info.outputs.version_name }}
          body_path: ${{ steps.release_info.outputs.changelog_path }}
          files: ${{ steps.release_info.outputs.apk_path }}
          fail_on_unmatched_files: true
          make_latest: true
