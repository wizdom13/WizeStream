name: Generate Room schema 21

on:
  push:
    branches:
      - learning-content-selection

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate schema with one KSP variant
        run: ./gradlew :app:kspDebugKotlin --no-parallel --stacktrace
      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-21
          path: app/schemas/org.schabi.newpipe.database.AppDatabase/21.json
          if-no-files-found: error
